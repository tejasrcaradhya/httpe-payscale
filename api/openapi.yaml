openapi: 3.0.3
info:
  title: HTTPE — PayScale Transaction Processing API
  description: >
    Public API for the PayScale High-Throughput Transaction Processing Engine.
    Covers P2P payment initiation, transaction/account queries, merchant
    settlement history, and webhook subscriptions.
  version: "1.0.0"
  contact:
    name: PayScale Platform Engineering
servers:
  - url: https://api.payscale.example.in/v1
    description: Production (Mumbai region)
  - url: https://sandbox-api.payscale.example.in/v1
    description: Sandbox / testing

security:
  - bearerAuth: []

tags:
  - name: Transactions
  - name: Accounts
  - name: Settlements
  - name: Webhooks

paths:
  /transactions:
    post:
      tags: [Transactions]
      summary: Initiate a P2P payment transaction
      description: >
        Creates a new transaction. Must include an Idempotency-Key header —
        retrying the same key returns the original result without
        reprocessing (FR-002). A concurrent request using the same key that
        is still being processed returns 409 Conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
          example: "b3f1c2a0-4e2a-4b8e-9c1a-2f6e7d8a9b10"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            example:
              transaction_type: P2P
              source_account_id: "018f2e4a-7b1c-7d3e-8a2b-1c3d4e5f6a7b"
              destination_account_id: "018f2e4a-7b1c-7d3e-8a2b-1c3d4e5f6a7c"
              amount: "500.00"
              currency: INR
      responses:
        '201':
          description: Transaction created and completed (or failed) synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INSUFFICIENT_BALANCE
                  message: "Account balance is insufficient for this transaction."
        '409':
          description: A request with this idempotency key is already being processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: DUPLICATE_REQUEST_IN_PROGRESS
                  message: "A request with this idempotency key is currently being processed. Retry shortly."
        '422':
          description: Transaction rejected (fraud flag, frozen account, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: A required downstream shard is unavailable; transaction was reversed if partially applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: RECEIVER_SHARD_UNAVAILABLE
                  message: "Receiver's account shard is temporarily unavailable. The transaction was reversed; please retry."

    get:
      tags: [Transactions]
      summary: List transactions (cursor-paginated)
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's next_cursor field
          schema:
            type: string
      responses:
        '200':
          description: A page of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /transactions/{transaction_id}:
    get:
      tags: [Transactions]
      summary: Get a single transaction by ID
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /transactions/{transaction_id}/events:
    get:
      tags: [Transactions]
      summary: Get the full saga event history for a transaction (audit/support view)
      parameters:
        - $ref: '#/components/parameters/TransactionIdPath'
      responses:
        '200':
          description: Ordered list of state transitions for this transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id:
                    type: string
                    format: uuid
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{account_id}:
    get:
      tags: [Accounts]
      summary: Get account details
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /accounts/{account_id}/balance:
    get:
      tags: [Accounts]
      summary: Get current balance only (lightweight, cache-backed)
      description: >
        Served from Redis cache with a 2-5 second TTL (ADR-005). May be
        briefly stale for display purposes; the transaction write path never
        relies on this endpoint's data.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /merchants/{merchant_account_id}/settlements:
    get:
      tags: [Settlements]
      summary: List settlement history for a merchant (cursor-paginated)
      parameters:
        - name: merchant_account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of settlement records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /webhooks:
    post:
      tags: [Webhooks]
      summary: Register a webhook subscription for transaction status updates (FR-008)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TransactionIdPath:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountIdPath:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: "amount must be greater than 0"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: "No transaction found with the given ID"
    RateLimited:
      description: Rate limit exceeded for this account's tier
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: "Request rate exceeds this account's tier limit."

  schemas:
    TransactionStatus:
      type: string
      enum: [INITIATED, PROCESSING, COMPLETED, FAILED, REVERSED]

    TransactionType:
      type: string
      enum: [P2P, MERCHANT_PAYMENT, SETTLEMENT, REVERSAL, FEE]

    CreateTransactionRequest:
      type: object
      required: [transaction_type, source_account_id, destination_account_id, amount, currency]
      properties:
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        source_account_id:
          type: string
          format: uuid
        destination_account_id:
          type: string
          format: uuid
        amount:
          type: string
          description: Decimal amount as a string, to avoid floating-point precision loss
          example: "500.00"
        currency:
          type: string
          example: INR

    Transaction:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        source_account_id:
          type: string
          format: uuid
        destination_account_id:
          type: string
          format: uuid
        amount:
          type: string
        currency:
          type: string
        status:
          $ref: '#/components/schemas/TransactionStatus'
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    TransactionEvent:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [STATE_TRANSITION, COMPENSATION, RETRY]
        from_state:
          type: string
          nullable: true
        to_state:
          type: string
        created_at:
          type: string
          format: date-time

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        next_cursor:
          type: string
          nullable: true
          description: Pass this as `cursor` to fetch the next page; null when there are no more results
        has_more:
          type: boolean

    Account:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        account_type:
          type: string
          enum: [SAVINGS, CURRENT, WALLET, MERCHANT, SETTLEMENT_POOL]
        currency:
          type: string
        status:
          type: string
          enum: [ACTIVE, FROZEN, SUSPENDED, CLOSED]
        tier:
          type: string
          enum: [BASIC, PREMIUM, MERCHANT]
        available_balance:
          type: string
        created_at:
          type: string
          format: date-time

    Balance:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        available_balance:
          type: string
        currency:
          type: string
        as_of:
          type: string
          format: date-time
          description: Timestamp this balance was read — may be up to a few seconds behind the true value (ADR-005)

    MerchantSettlement:
      type: object
      properties:
        settlement_id:
          type: string
          format: uuid
        merchant_account_id:
          type: string
          format: uuid
        settlement_batch_id:
          type: string
          format: uuid
        gross_amount:
          type: string
        fee_amount:
          type: string
        net_amount:
          type: string
        transaction_count:
          type: integer
        status:
          type: string
          enum: [PENDING, SETTLED, FAILED]
        settlement_date:
          type: string
          format: date

    SettlementListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MerchantSettlement'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    CreateWebhookRequest:
      type: object
      required: [url, event_types]
      properties:
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
            enum: [transaction.completed, transaction.failed, transaction.reversed, settlement.completed]

    Webhook:
      type: object
      properties:
        webhook_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true
